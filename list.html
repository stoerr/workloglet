<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work Log List</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/worklog.css">
</head>
<body>
<div class="container list-container">
    <h1 class="mb-4">Work Log Entries</h1>
    <!-- Container for grouped log entries -->
    <div id="logContainer"></div>
</div>

<!-- Bootstrap Bundle with Popper (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Fetch log entries from the server
        fetch('/logs')
            .then(response => response.json())
            .then(function (entries) {
                // Group entries by day using YYYY-MM-DD as the key
                const groupedByDay = {};
                entries.forEach(function (entry) {
                    const dateObj = new Date(entry.timestamp);
                    // Use ISO date (YYYY-MM-DD)
                    const dateKey = dateObj.toISOString().split('T')[0];
                    if (!groupedByDay[dateKey]) {
                        groupedByDay[dateKey] = [];
                    }
                    groupedByDay[dateKey].push(entry);
                });

                // Sort days in descending order (most recent first)
                const sortedDays = Object.keys(groupedByDay).sort((a, b) => new Date(b) - new Date(a));
                const container = document.getElementById('logContainer');

                sortedDays.forEach(function (day) {
                    const dayEntries = groupedByDay[day];
                    const dayObj = new Date(day);
                    // Get the weekday name, e.g., Monday
                    const options = {weekday: 'long'};
                    const weekday = dayObj.toLocaleDateString(undefined, options);

                    // Create a container for the day group
                    const dayGroupDiv = document.createElement('div');
                    dayGroupDiv.className = 'day-group';

                    // Create and append a header for the day
                    const dayHeader = document.createElement('h2');
                    dayHeader.textContent = day + ' (' + weekday + ')';
                    dayGroupDiv.appendChild(dayHeader);

                    // Group entries for this day by task
                    const tasksGroup = {};
                    dayEntries.forEach(function (entry) {
                        if (!tasksGroup[entry.task]) {
                            tasksGroup[entry.task] = [];
                        }
                        tasksGroup[entry.task].push(entry);
                    });

                    // For each task, sort the entries by time (ascending) and build the list with grouping consecutive entries
                    Object.keys(tasksGroup).forEach(function (task) {
                        // Sort entries for this task by timestamp ascending
                        tasksGroup[task].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                        const taskGroupDiv = document.createElement('div');
                        taskGroupDiv.className = 'task-group';

                        const taskHeader = document.createElement('h4');
                        taskHeader.textContent = task;
                        taskGroupDiv.appendChild(taskHeader);

                        const ul = document.createElement('ul');
                        let group = [];

                        tasksGroup[task].forEach(function (entry, index, array) {
                            if (group.length === 0) {
                                group.push(entry);
                            } else {
                                if (entry.description === group[0].description) {
                                    group.push(entry);
                                } else {
                                    // Group ended, output group
                                    const li = document.createElement('li');
                                    const times = group.map(e => new Date(e.timestamp).toLocaleTimeString()).join(', ');
                                    li.textContent = times + ' - ' + group[0].description;
                                    ul.appendChild(li);
                                    group = [entry];
                                }
                            }
                            // At the end of the array, output the group if it exists
                            if (index === array.length - 1 && group.length > 0) {
                                const li = document.createElement('li');
                                const times = group.map(e => new Date(e.timestamp).toLocaleTimeString()).join(', ');
                                li.textContent = times + ' - ' + group[0].description;
                                ul.appendChild(li);
                            }
                        });

                        taskGroupDiv.appendChild(ul);
                        dayGroupDiv.appendChild(taskGroupDiv);
                    });

                    container.appendChild(dayGroupDiv);
                });
            })
            .catch(function (error) {
                console.error('Error loading log entries:', error);
            });

        // Handle quit button click
        document.getElementById('quitButton').addEventListener('click', function () {
            fetch('/quit')
                .then(() => {
                    window.open('', '_self', '');
                    window.close();
                })
                .catch(() => {
                    window.open('', '_self', '');
                    window.close();
                });
        });
    });
</script>
<button id="quitButton" class="btn btn-danger">Quit</button>
</body>
</html>
