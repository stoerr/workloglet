<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hour Logging</title>
  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/worklog.css">
</head>
<body class="worklog">
  <div class="container worklog">
    <h1 class="mb-4">Work Hour Logging</h1>
    <!-- Display the time the dialog was opened as per specification -->
    <p id="openTime" class="text-muted"></p>
    <form id="logForm">
      <div class="mb-3">
        <label for="taskSelect" class="form-label">Select Task</label>
        <!-- Removed name attribute per specification -->
        <select class="form-select" id="taskSelect" required>
          <option value="" disabled selected>Select a task</option>
        </select>
      </div>
      <div class="mb-3" id="new-task-group">
        <label for="newtask" class="form-label">Task</label>
        <!-- Changed name from "newtask" to "task" so that the input field is the one sent -->
        <input type="text" class="form-control" id="newtask" name="task" placeholder="Enter task">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Additional details"></textarea>
      </div>
      <button type="submit" class="btn btn-primary me-2">Submit</button>
      <button type="button" id="skipButton" class="btn btn-secondary">Skip</button>
      <button type="button" id="copyButton" class="btn btn-warning ms-2">Copy from last</button>
      <button type="button" id="listButton" class="btn btn-info ms-2">List</button>
      <div id="error-message" class="text-danger mt-3"></div>
    </form>
  </div>
  
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Set and display the dialog opened time in a format close to ISO date+time
      const openTimeElem = document.getElementById('openTime');
      const now = new Date();
      const formattedDateTime = now.toISOString().replace('T', ' ').slice(0, 16);
      const weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
      openTimeElem.textContent = `Dialog Opened: ${formattedDateTime} (${weekday})`;
      
      const taskSelect = document.getElementById('taskSelect');
      const newTaskInput = document.getElementById('newtask');
      const logForm = document.getElementById('logForm');
      const skipButton = document.getElementById('skipButton');
      const copyButton = document.getElementById('copyButton');
      const listButton = document.getElementById('listButton');
      const errorMessage = document.getElementById('error-message');
      
      // Fetch tasks from the server
      fetch('/tasks')
        .then(response => response.json())
        .then(tasks => {
          tasks.forEach(task => {
            const option = document.createElement('option');
            option.value = task;
            option.textContent = task;
            taskSelect.appendChild(option);
          });
          // Add the 'Other' option
          const otherOption = document.createElement('option');
          otherOption.value = 'Other';
          otherOption.textContent = 'Other...';
          taskSelect.appendChild(otherOption);
        })
        .catch(err => {
          errorMessage.textContent = 'Error loading tasks: ' + err;
        });
      
      // Update newTaskInput based on dropdown selection
      taskSelect.addEventListener('change', function() {
        if (this.value === 'Other') {
          newTaskInput.value = '';
        } else {
          newTaskInput.value = this.value;
        }
      });
  
      // If user types in the new task field manually, set dropdown to 'Other'
      newTaskInput.addEventListener('input', function() {
        if (this.value.trim() !== '') {
          taskSelect.value = 'Other';
        }
      });
      
      // Handle Copy from last button click to fill task and description
      copyButton.addEventListener('click', function() {
        fetch('/logs')
          .then(response => response.json())
          .then(function(entries) {
            if (entries.length > 0) {
              const lastEntry = entries[0];
              // Try to set the dropdown to the task if it exists
              let found = false;
              for (let i = 0; i < taskSelect.options.length; i++) {
                if (taskSelect.options[i].value === lastEntry.task) {
                  taskSelect.value = lastEntry.task;
                  found = true;
                  break;
                }
              }
              if (!found) {
                taskSelect.value = 'Other';
              }
              newTaskInput.value = lastEntry.task;
              document.getElementById('description').value = lastEntry.description;
            }
          })
          .catch(function(error) {
            errorMessage.textContent = 'Error copying last entry: ' + error;
          });
      });
      
      // Handle form submission
      logForm.addEventListener('submit', function(e) {
        e.preventDefault();
        errorMessage.textContent = '';
        if (newTaskInput.value.trim() === '') {
          errorMessage.textContent = 'Please enter a task.';
          return;
        }
  
        const formData = new FormData(logForm);
        const params = new URLSearchParams();
        for (const pair of formData.entries()) {
          params.append(pair[0], pair[1]);
        }
        
        fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        })
        .then(response => {
          if (!response.ok) {
            return response.text().then(text => { throw new Error(text) });
          }
          return response.text();
        })
        .then(() => {
          // On submission success, close the tab without showing an alert
          window.open('', '_self', '');
          window.close();
        })
        .catch(err => {
          errorMessage.textContent = 'Submission failed: ' + err;
        });
      });
      
      // Handle skip button click to terminate the server and then close the application
      skipButton.addEventListener('click', function() {
        fetch('/skip')
          .then(() => {
            window.open('', '_self', '');
            window.close();
          })
          .catch(() => {
            window.open('', '_self', '');
            window.close();
          });
      });
      
      // Handle list button click to open list page in the same window using window.open
      listButton.addEventListener('click', function() {
        window.open('/list', '_self');
      });
    });
  </script>
</body>
</html>
