<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hour Logging</title>
  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #eaeaea;
      padding-top: 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #new-task-group {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Work Hour Logging</h1>
    <form id="logForm">
      <div class="mb-3">
        <label for="taskSelect" class="form-label">Task</label>
        <select class="form-select" id="taskSelect" name="task" required>
          <option value="" disabled selected>Select a task</option>
        </select>
      </div>
      <div class="mb-3" id="new-task-group">
        <label for="newtask" class="form-label">New Task</label>
        <input type="text" class="form-control" id="newtask" name="newtask" placeholder="Enter new task">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Additional details"></textarea>
      </div>
      <button type="submit" class="btn btn-primary me-2">Submit</button>
      <button type="button" id="skipButton" class="btn btn-secondary">Skip</button>
      <button type="button" id="listButton" class="btn btn-info ms-2">List</button>
      <div id="error-message" class="text-danger mt-3"></div>
    </form>
  </div>
  
  <!-- Bootstrap Bundle with Popper (optional if needed) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const taskSelect = document.getElementById('taskSelect');
      const newTaskGroup = document.getElementById('new-task-group');
      const logForm = document.getElementById('logForm');
      const skipButton = document.getElementById('skipButton');
      const listButton = document.getElementById('listButton');
      const errorMessage = document.getElementById('error-message');
      
      // Fetch tasks from the server
      fetch('/tasks')
        .then(response => response.json())
        .then(tasks => {
          tasks.forEach(task => {
            const option = document.createElement('option');
            option.value = task;
            option.textContent = task;
            taskSelect.appendChild(option);
          });
          // Add the 'Other' option
          const otherOption = document.createElement('option');
          otherOption.value = 'Other';
          otherOption.textContent = 'Other...';
          taskSelect.appendChild(otherOption);
        })
        .catch(err => {
          errorMessage.textContent = 'Error loading tasks: ' + err;
        });
      
      // Toggle new task input based on selection
      taskSelect.addEventListener('change', function() {
        if (this.value === 'Other') {
          newTaskGroup.style.display = 'block';
        } else {
          newTaskGroup.style.display = 'none';
        }
      });
      
      // Handle form submission
      logForm.addEventListener('submit', function(e) {
        e.preventDefault();
        errorMessage.textContent = '';

        const formData = new FormData(logForm);
        const params = new URLSearchParams();
        for (const pair of formData.entries()) {
          params.append(pair[0], pair[1]);
        }
        
        fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        })
        .then(response => response.text())
        .then(() => {
          // On submission success, close the tab without showing an alert
          window.open('', '_self', '');
          window.close();
        })
        .catch(err => {
          errorMessage.textContent = 'Submission failed: ' + err;
        });
      });
      
      // Handle skip button click to terminate the server and then close the application
      skipButton.addEventListener('click', function() {
        fetch('/skip')
          .then(() => {
            window.open('', '_self', '');
            window.close();
          })
          .catch(() => {
            window.open('', '_self', '');
            window.close();
          });
      });
      
      // Handle list button click to open list page in a new window
      listButton.addEventListener('click', function() {
        window.open('/list', '_blank');
      });
    });
  </script>
</body>
</html>
